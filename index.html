<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yassir Technical Interview & Assessment Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        /* Custom scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // 1. DATABASE SCHEMAS DEFINITION
        const SCHEMAS = {
          olist: {
            id: 'olist',
            name: 'Olist E-Commerce Marketplace',
            tables: [
              { name: 'customers', cols: ['customer_id (PK)', 'customer_unique_id', 'customer_state', 'city'] },
              { name: 'orders', cols: ['order_id (PK)', 'customer_id (FK)', 'order_status', 'order_purchase_timestamp'] },
              { name: 'order_items', cols: ['order_id (FK)', 'order_item_id (PK)', 'product_id (FK)', 'price', 'freight_value'] },
              { name: 'products', cols: ['product_id (PK)', 'product_category_name', 'product_weight_g'] }
            ]
          },
          yassir_delivery: {
            id: 'yassir_delivery',
            name: 'Yassir Last-Mile Delivery',
            tables: [
              { name: 'users', cols: ['user_id (PK)', 'name', 'email', 'city', 'signup_date'] },
              { name: 'orders', cols: ['order_id (PK)', 'user_id (FK)', 'driver_id (FK)', 'order_status', 'order_value', 'order_timestamp'] },
              { name: 'drivers', cols: ['driver_id (PK)', 'vehicle_type', 'rating', 'city'] },
              { name: 'city_geofence', cols: ['city_id (PK)', 'city_name', 'base_fare', 'surge_multiplier'] }
            ]
          },
          hr_payroll: {
            id: 'hr_payroll',
            name: 'Corporate HR & Payroll',
            tables: [
              { name: 'employees', cols: ['employee_id (PK)', 'first_name', 'last_name', 'department_id (FK)', 'salary', 'hire_date'] },
              { name: 'departments', cols: ['department_id (PK)', 'department_name', 'manager_id'] },
              { name: 'performance_reviews', cols: ['review_id (PK)', 'employee_id (FK)', 'rating', 'review_year'] }
            ]
          },
          fintech: {
            id: 'fintech',
            name: 'Fintech Payments & Wallets',
            tables: [
              { name: 'accounts', cols: ['account_id (PK)', 'user_id (FK)', 'currency', 'balance'] },
              { name: 'transactions', cols: ['transaction_id (PK)', 'sender_acc (FK)', 'receiver_acc (FK)', 'amount', 'status', 'created_at'] }
            ]
          }
        };

        const INITIAL_QUESTION_BANK = [
          {
            id: 'q1',
            schemaId: 'hr_payroll',
            title: 'Employee & Department Inner Join',
            type: 'mcq',
            difficulty: 'Easy',
            question: 'How do you write a query to retrieve all columns from the employees and departments tables where the department_id matches?',
            options: [
              { id: 'A', text: 'SELECT * FROM employees INNER JOIN departments ON employees.department_id = departments.department_id;' },
              { id: 'B', text: 'SELECT * FROM employees JOIN departments WHERE employees.department_id = departments.department_id;' },
              { id: 'C', text: 'SELECT * FROM employees LEFT JOIN departments ON employees.department_id = departments.department_id;' }
            ],
            correct: 'A',
            explanation: 'INNER JOIN returns only matching rows across both tables on department_id.'
          },
          {
            id: 'q2',
            schemaId: 'hr_payroll',
            title: 'Filtering Aggregated Salaries',
            type: 'mcq',
            difficulty: 'Medium',
            question: 'Which SQL query finds the average salary for each department, but only includes departments with an average salary greater than 50,000?',
            options: [
              { id: 'A', text: 'SELECT department_id, AVG(salary) FROM employees WHERE AVG(salary) > 50000 GROUP BY department_id;' },
              { id: 'B', text: 'SELECT department_id, AVG(salary) FROM employees GROUP BY department_id HAVING AVG(salary) > 50000;' },
              { id: 'C', text: 'SELECT department_id, AVG(salary) FROM employees GROUP BY department_id WHERE AVG(salary) > 50000;' },
              { id: 'D', text: 'SELECT department_id, AVG(salary) FROM employees HAVING AVG(salary) > 50000 GROUP BY department_id;' }
            ],
            correct: 'B',
            explanation: 'The HAVING clause filters group results after aggregation (AVG).'
          },
          {
            id: 'q3',
            schemaId: 'hr_payroll',
            title: 'Subquery Comparison',
            type: 'mcq',
            difficulty: 'Medium',
            question: 'Which SQL query retrieves all employees whose salary is greater than the overall average salary?',
            options: [
              { id: 'A', text: 'SELECT * FROM employees WHERE salary > (SELECT AVG(salary) FROM employees);' },
              { id: 'B', text: 'SELECT * FROM employees WHERE salary > AVG(salary);' },
              { id: 'C', text: 'SELECT * FROM employees WHERE salary > ALL (SELECT AVG(salary) FROM employees);' },
              { id: 'D', text: 'SELECT * FROM employees WHERE salary IN (SELECT AVG(salary) FROM employees);' }
            ],
            correct: 'A',
            explanation: 'A subquery computes the aggregate average before comparing against individual employee rows.'
          },
          {
            id: 'q4',
            schemaId: 'hr_payroll',
            title: 'Department Headcount',
            type: 'mcq',
            difficulty: 'Easy',
            question: 'Which SQL statement will count the total number of employees in each department?',
            options: [
              { id: 'A', text: 'SELECT department_id, COUNT(*) FROM employees;' },
              { id: 'B', text: 'SELECT department_id, COUNT(*) FROM employees GROUP BY department_id;' },
              { id: 'C', text: 'SELECT COUNT(department_id) FROM employees GROUP BY department_id;' },
              { id: 'D', text: 'SELECT department_id, COUNT(department_id) FROM employees;' }
            ],
            correct: 'B',
            explanation: 'GROUP BY department_id is required when selecting non-aggregated column department_id with COUNT(*).'
          },
          {
            id: 'q5',
            schemaId: 'olist',
            title: 'Orders & Customers Linking',
            type: 'mcq',
            difficulty: 'Easy',
            question: 'How would you write a query to combine rows from orders and customers where customer_id matches?',
            options: [
              { id: 'A', text: 'SELECT * FROM orders INNER JOIN customers ON orders.customer_id = customers.customer_id;' },
              { id: 'B', text: 'SELECT * FROM orders JOIN customers WHERE orders.customer_id = customers.customer_id;' },
              { id: 'C', text: 'SELECT * FROM orders LEFT JOIN customers ON orders.customer_id = customers.customer_id;' },
              { id: 'D', text: 'SELECT * FROM orders RIGHT JOIN customers ON orders.customer_id = customers.customer_id;' }
            ],
            correct: 'A',
            explanation: 'INNER JOIN with an explicit ON clause is standard SQL syntax.'
          },
          {
            id: 'q6',
            schemaId: 'olist',
            title: 'Sales per Category (Including Zero Sales)',
            type: 'mcq',
            difficulty: 'Hard',
            question: 'How would you find total sales per product category, INCLUDING categories without any order items?',
            options: [
              { id: 'A', text: 'SELECT products.product_category_name, SUM(order_items.price) FROM orders RIGHT JOIN order_items ON orders.order_id = order_items.order_id RIGHT JOIN products ON order_items.product_id = products.product_id GROUP BY products.product_category_name;' },
              { id: 'B', text: 'SELECT products.product_category_name, SUM(order_items.price) FROM orders JOIN order_items USING(order_id) JOIN products USING(product_id) GROUP BY products.product_category_name;' },
              { id: 'C', text: 'SELECT products.product_category_name, SUM(order_items.price) FROM products LEFT JOIN order_items ON products.product_id = order_items.product_id LEFT JOIN orders ON order_items.order_id = orders.order_id GROUP BY products.product_category_name;' },
              { id: 'D', text: 'SELECT products.product_category_name, SUM(order_items.price) FROM orders INNER JOIN order_items ON orders.order_id = order_items.order_id INNER JOIN products ON order_items.product_id = products.product_id GROUP BY products.product_category_name;' }
            ],
            correct: 'C',
            explanation: 'Starting from products table with LEFT JOIN preserves all product categories even when sales are NULL.'
          },
          {
            id: 'q7',
            schemaId: 'yassir_delivery',
            title: 'The Algiers Scenario: Code Review & Refactoring',
            type: 'scenario',
            difficulty: 'Hard',
            question: 'Analyze the query designed to return "the order value of every Algiers user\'s 2nd completed order". Point out the logical flaws and provide a corrected SQL query.',
            buggySql: `WITH RankedOrders AS (\n    SELECT u.user_id, o.order_id, o.order_value, o.order_status,\n    ROW_NUMBER() OVER (ORDER BY o.order_timestamp ASC) AS order_sequence\n    FROM users u JOIN orders o ON u.user_id = o.user_id\n    WHERE u.city = 'Algiers' \n)\nSELECT user_id, order_id, order_value FROM RankedOrders\nWHERE order_sequence = 2 AND order_status = 'completed';`,
            correctSql: `WITH RankedOrders AS (\n    SELECT u.user_id, o.order_value,\n    ROW_NUMBER() OVER (\n        PARTITION BY u.user_id \n        ORDER BY o.order_timestamp ASC\n    ) AS order_sequence\n    FROM users u\n    JOIN orders o ON u.user_id = o.user_id\n    WHERE u.city = 'Algiers' \n      AND o.order_status = 'completed'\n)\nSELECT user_id, order_value\nFROM RankedOrders WHERE order_sequence = 2;`
          },
          {
            id: 'q8',
            schemaId: 'yassir_delivery',
            title: 'Active Users without Cancelled Orders',
            type: 'mcq',
            difficulty: 'Medium',
            question: 'Which query selects users who placed orders, but NEVER had a single order with order_status = "cancelled"?',
            options: [
              { id: 'A', text: 'SELECT user_id FROM orders WHERE order_status != "cancelled";' },
              { id: 'B', text: 'SELECT DISTINCT user_id FROM orders WHERE user_id NOT IN (SELECT user_id FROM orders WHERE order_status = "cancelled");' },
              { id: 'C', text: 'SELECT user_id FROM orders GROUP BY user_id HAVING order_status != "cancelled";' },
              { id: 'D', text: 'SELECT DISTINCT user_id FROM orders WHERE order_status IS NULL;' }
            ],
            correct: 'B',
            explanation: 'Option B excludes any user_id that appears in the list of users with at least one cancelled order.'
          },
          {
            id: 'q9',
            schemaId: 'fintech',
            title: 'Wallet Balance Running Total',
            type: 'mcq',
            difficulty: 'Hard',
            question: 'Which Window Function clause calculates a running total sum of transaction amounts ordered by created_at?',
            options: [
              { id: 'A', text: 'SUM(amount) OVER (ORDER BY created_at ASC)' },
              { id: 'B', text: 'SUM(amount) GROUP BY created_at' },
              { id: 'C', text: 'RUNNING_SUM(amount) OVER (ORDER BY created_at)' },
              { id: 'D', text: 'CUMULATIVE(amount) OVER (PARTITION BY transaction_id)' }
            ],
            correct: 'A',
            explanation: 'SUM() combined with OVER (ORDER BY created_at) produces an unbounded preceding running total.'
          },
          {
            id: 'q10',
            schemaId: 'yassir_delivery',
            title: 'Driver Rating Percentile Ranking',
            type: 'mcq',
            difficulty: 'Medium',
            question: 'To find the top 10% highest rated drivers per city, which window function is best suited?',
            options: [
              { id: 'A', text: 'DENSE_RANK() OVER (PARTITION BY city ORDER BY rating DESC)' },
              { id: 'B', text: 'NTILE(10) OVER (PARTITION BY city ORDER BY rating DESC)' },
              { id: 'C', text: 'ROW_NUMBER() OVER (ORDER BY rating DESC)' },
              { id: 'D', text: 'COUNT(rating) OVER (PARTITION BY city)' }
            ],
            correct: 'B',
            explanation: 'NTILE(10) splits rows into 10 equal buckets per city, where bucket 1 represents the top 10% percentile.'
          }
        ];

        function App() {
          // Routes: 'candidate_entry', 'candidate_exam', 'admin_login', 'page_questions', 'page_exams', 'page_results', 'page_settings'
          const [route, setRoute] = useState('candidate_entry');
          
          // Toast Notification Banner
          const [toast, setToast] = useState(null);
          const showToast = useCallback((msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3500);
          }, []);

          // Admin Authentication
          const [adminAuth, setAdminAuth] = useState({ 
            id: 'admin', 
            password: '', 
            isAuthenticated: false, 
            error: '', 
            name: 'Interviewer Admin', 
            role: 'Lead Data Analytics Evaluator' 
          });

          // Repositories in LocalStorage
          const [questionBank, setQuestionBank] = useState(() => {
            const saved = localStorage.getItem('yassir_qbank');
            return saved ? JSON.parse(saved) : INITIAL_QUESTION_BANK;
          });

          const [exams, setExams] = useState(() => {
            const saved = localStorage.getItem('yassir_exams');
            return saved ? JSON.parse(saved) : [
              {
                id: 'exam-001',
                title: 'Yassir Product Data Analyst Technical Screen',
                passScore: 70,
                timeLimitMinutes: 20,
                questionIds: ['q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8'],
                accessCode: 'YASSIR-2026',
                createdAt: new Date().toISOString()
              },
              {
                id: 'exam-002',
                title: 'Data Engineering & Window Functions Screen',
                passScore: 80,
                timeLimitMinutes: 25,
                questionIds: ['q2', 'q3', 'q6', 'q7', 'q9', 'q10'],
                accessCode: 'DE-SQL-88',
                createdAt: new Date().toISOString()
              }
            ];
          });

          const [submissions, setSubmissions] = useState(() => {
            const saved = localStorage.getItem('yassir_submissions');
            return saved ? JSON.parse(saved) : [];
          });

          // Active Candidate Exam Session State
          const [activeExamId, setActiveExamId] = useState('exam-001');
          const [candidateInfo, setCandidateInfo] = useState({ name: '', email: '', examCode: 'YASSIR-2026' });
          const [candidateSlide, setCandidateSlide] = useState(0); // 0 = entry, 1..N = Qs, N+1 = submitted
          const [candidateAnswers, setCandidateAnswers] = useState({});
          const [candidateTextAnswers, setCandidateTextAnswers] = useState({});
          const [startTime, setStartTime] = useState(null);
          const [elapsedSeconds, setElapsedSeconds] = useState(0);
          const [tabSwitchCount, setTabSwitchCount] = useState(0);

          // Inspection Modal State
          const [selectedSubmission, setSelectedSubmission] = useState(null);

          // Admin Add/Edit Question Modal State
          const [editingQuestion, setEditingQuestion] = useState(null);

          const [newQuestionForm, setNewQuestionForm] = useState({
            title: '', schemaId: 'olist', type: 'mcq', difficulty: 'Medium', question: '',
            options: [{ id: 'A', text: '' }, { id: 'B', text: '' }, { id: 'C', text: '' }, { id: 'D', text: '' }],
            correct: 'A', explanation: ''
          });

          // Admin Create/Edit Exam Form State
          const [editingExamId, setEditingExamId] = useState(null);
          const [newExamForm, setNewExamForm] = useState({
            title: 'Senior Data Analytics SQL Challenge',
            timeLimitMinutes: 20,
            passScore: 70,
            selectedQuestionIds: ['q1', 'q2', 'q6', 'q7']
          });

          // Compute active exam & question details BEFORE hooks
          const activeExam = useMemo(() => {
            return exams.find(e => e.id === activeExamId) || exams[0];
          }, [exams, activeExamId]);

          const activeQuestions = useMemo(() => {
            if (!activeExam || !activeExam.questionIds) return [];
            return activeExam.questionIds.map(qid => questionBank.find(q => q.id === qid)).filter(Boolean);
          }, [activeExam, questionBank]);

          // Sync storage
          useEffect(() => { localStorage.setItem('yassir_qbank', JSON.stringify(questionBank)); }, [questionBank]);
          useEffect(() => { localStorage.setItem('yassir_exams', JSON.stringify(exams)); }, [exams]);
          useEffect(() => { localStorage.setItem('yassir_submissions', JSON.stringify(submissions)); }, [submissions]);

          // ANTI-CHEATING PROTECTION LISTENERS DURING ACTIVE EXAM
          useEffect(() => {
            const totalQuestions = activeQuestions ? activeQuestions.length : 0;
            if (route !== 'candidate_exam' || candidateSlide < 1 || candidateSlide > totalQuestions) return;

            const handlePreventCopy = (e) => {
              e.preventDefault();
              showToast("Copying content is disabled during the exam!", "error");
            };

            const handlePreventContextMenu = (e) => {
              e.preventDefault();
            };

            const handleKeyDown = (e) => {
              if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                showToast("Keyboard shortcuts disabled during exam!", "error");
              }
              if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j'))) {
                e.preventDefault();
              }
            };

            const handleVisibilityChange = () => {
              if (document.hidden) {
                setTabSwitchCount(prev => {
                  const newCount = prev + 1;
                  showToast(`Warning: Screen/Tab switch detected! (${newCount} times)`, "error");
                  return newCount;
                });
              }
            };

            window.addEventListener('copy', handlePreventCopy);
            window.addEventListener('cut', handlePreventCopy);
            window.addEventListener('contextmenu', handlePreventContextMenu);
            window.addEventListener('keydown', handleKeyDown);
            document.addEventListener('visibilitychange', handleVisibilityChange);

            return () => {
              window.removeEventListener('copy', handlePreventCopy);
              window.removeEventListener('cut', handlePreventCopy);
              window.removeEventListener('contextmenu', handlePreventContextMenu);
              window.removeEventListener('keydown', handleKeyDown);
              document.removeEventListener('visibilitychange', handleVisibilityChange);
            };
          }, [route, candidateSlide, activeQuestions, showToast]);

          // Keep ref of adminAuth to avoid stale closures in hashchange listener
          const adminAuthRef = useRef(adminAuth);
          useEffect(() => { adminAuthRef.current = adminAuth; }, [adminAuth]);

          // Handle Hash Link Navigation (e.g. #exam=YASSIR-2026 or #questions)
          useEffect(() => {
            const parseHash = () => {
              const hash = window.location.hash.replace('#', '');
              if (hash.startsWith('exam=')) {
                const code = hash.split('=')[1];
                const foundExam = exams.find(e => e.accessCode.toLowerCase() === code.toLowerCase());
                if (foundExam) {
                  setActiveExamId(foundExam.id);
                  setCandidateInfo(prev => ({ ...prev, examCode: foundExam.accessCode }));
                  setRoute('candidate_entry');
                }
              } else if (['questions', 'exams', 'results', 'settings'].includes(hash)) {
                if (adminAuthRef.current.isAuthenticated) {
                  setRoute(`page_${hash}`);
                } else {
                  setRoute('admin_login');
                }
              } else if (hash === 'admin') {
                if (adminAuthRef.current.isAuthenticated) {
                  setRoute('page_results');
                  window.location.hash = 'results';
                } else {
                  setRoute('admin_login');
                }
              } else if (hash === 'candidate') {
                setRoute('candidate_entry');
              }
            };

            parseHash();
            window.addEventListener('hashchange', parseHash);
            return () => window.removeEventListener('hashchange', parseHash);
          }, [exams]);

          // Timer
          useEffect(() => {
            let timer;
            const totalQuestions = activeQuestions ? activeQuestions.length : 0;
            if (startTime && route === 'candidate_exam' && candidateSlide >= 1 && candidateSlide <= totalQuestions) {
              timer = setInterval(() => {
                setElapsedSeconds(Math.floor((Date.now() - startTime) / 1000));
              }, 1000);
            }
            return () => clearInterval(timer);
          }, [startTime, route, candidateSlide, activeQuestions]);

          const handleAdminLogin = (e) => {
            e.preventDefault();
            if (adminAuth.id.trim() === 'admin' && adminAuth.password === 'yassir2026!') {
              setAdminAuth({ ...adminAuth, isAuthenticated: true, error: '' });
              setRoute('page_results');
              window.location.hash = 'results';
              showToast("Admin session unlocked successfully!");
            } else {
              setAdminAuth({ ...adminAuth, error: 'Invalid Admin Credentials.' });
            }
          };

          const handleStartExam = (e) => {
            e.preventDefault();
            const matchedExam = exams.find(ex => ex.accessCode.trim().toLowerCase() === candidateInfo.examCode.trim().toLowerCase());
            if (!matchedExam) {
              showToast("Invalid Exam Access Code. Please check with interviewer.", "error");
              return;
            }
            setActiveExamId(matchedExam.id);
            setStartTime(Date.now());
            setCandidateSlide(1);
            setRoute('candidate_exam');
          };

          const handleSelectOption = (questionId, optionId) => {
            setCandidateAnswers(prev => ({ ...prev, [questionId]: optionId }));
          };

          const handleTextAnswer = (questionId, field, value) => {
            setCandidateTextAnswers(prev => ({
              ...prev,
              [questionId]: { ...prev[questionId], [field]: value }
            }));
          };

          const calculateCandidateScore = () => {
            let score = 0;
            let mcqTotal = 0;
            (activeQuestions || []).forEach(q => {
              if (q.type === 'mcq') {
                mcqTotal += 1;
                if (candidateAnswers[q.id] === q.correct) score += 1;
              }
            });
            return { score, mcqTotal };
          };

          const handleSubmitExam = () => {
            const { score, mcqTotal } = calculateCandidateScore();
            const submissionData = {
              id: `sub-${Date.now()}`,
              candidateName: candidateInfo.name,
              candidateEmail: candidateInfo.email,
              examId: activeExamId,
              examTitle: activeExam ? activeExam.title : 'Standard Assessment',
              mcqAnswers: candidateAnswers,
              textAnswers: candidateTextAnswers,
              mcqScore: score,
              mcqTotal: mcqTotal,
              percentage: mcqTotal > 0 ? Math.round((score / mcqTotal) * 100) : 0,
              timeTakenSeconds: elapsedSeconds,
              tabSwitches: tabSwitchCount,
              submittedAt: new Date().toLocaleString()
            };

            setSubmissions(prev => [submissionData, ...prev]);
            setCandidateSlide((activeQuestions ? activeQuestions.length : 0) + 1);
            showToast("Exam submitted successfully! Results saved.");
          };

          const handleSaveExam = (e) => {
            e.preventDefault();
            if (newExamForm.selectedQuestionIds.length === 0) {
              showToast("Select at least one question for the exam template.", "error");
              return;
            }

            if (editingExamId) {
              setExams(prev => prev.map(ex => ex.id === editingExamId ? {
                ...ex,
                title: newExamForm.title,
                timeLimitMinutes: parseInt(newExamForm.timeLimitMinutes),
                passScore: parseInt(newExamForm.passScore || 70),
                questionIds: newExamForm.selectedQuestionIds
              } : ex));
              showToast(`Exam Template '${newExamForm.title}' updated!`);
              setEditingExamId(null);
            } else {
              const accessCode = `YASSIR-${Math.floor(1000 + Math.random() * 9000)}`;
              const created = {
                id: `exam-${Date.now()}`,
                title: newExamForm.title,
                timeLimitMinutes: parseInt(newExamForm.timeLimitMinutes),
                passScore: parseInt(newExamForm.passScore || 70),
                questionIds: newExamForm.selectedQuestionIds,
                accessCode: accessCode,
                createdAt: new Date().toISOString()
              };
              setExams(prev => [created, ...prev]);
              showToast(`Exam Template '${created.title}' created! Code: ${accessCode}`);
            }

            setNewExamForm({
              title: 'Senior Data Analytics SQL Challenge',
              timeLimitMinutes: 20,
              passScore: 70,
              selectedQuestionIds: ['q1', 'q2', 'q6', 'q7']
            });
          };

          const handleEditExamClick = (ex) => {
            setEditingExamId(ex.id);
            setNewExamForm({
              title: ex.title,
              timeLimitMinutes: ex.timeLimitMinutes,
              passScore: ex.passScore || 70,
              selectedQuestionIds: ex.questionIds
            });

                            <select
                              value={newQuestionForm.difficulty}
                              onChange={e => setNewQuestionForm({ ...newQuestionForm, difficulty: e.target.value })}
                              className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white"
                            >
                              <option value="Easy">Easy</option>
                              <option value="Medium">Medium</option>
                              <option value="Hard">Hard</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-slate-400 font-semibold mb-1">Question Prompt</label>
                          <textarea
                            rows={3}
                            required
                            value={newQuestionForm.question}
                            onChange={e => setNewQuestionForm({ ...newQuestionForm, question: e.target.value })}
                            placeholder="Type question prompt..."
                            className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white"
                          />
                        </div>

                        <button type="submit" className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2 rounded">
                          Save to Question Bank
                        </button>
                      </form>
                    </div>
                  </div>
                )}

              </main>

              {/* FOOTER */}
              <footer className="h-10 border-t border-slate-900 bg-slate-950 px-6 flex items-center justify-between text-[11px] text-slate-500">
                <div>Yassir Technical Examination System • Hosted on GitHub Pages</div>
                <div className="font-mono">
                  Active Page: <strong className="text-slate-300 uppercase">{route}</strong>
                </div>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
