<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yassir Technical Assessment Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase JS SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
          apiKey: "",
          authDomain: "",
          projectId: "",
          storageBucket: "",
          messagingSenderId: "",
          appId: ""
        };

        let db = null;
        let isFirebaseConnected = false;

        if (typeof firebase !== "undefined" && firebaseConfig.apiKey && firebaseConfig.projectId) {
          try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isFirebaseConnected = true;
          } catch (e) {
            console.warn("Firebase fallback mode:", e);
          }
        }

        const { useState, useEffect, useMemo, useRef } = React;

        function App() {
          const [route, setRoute] = useState('candidate_entry');
          const [toast, setToast] = useState(null);

          const showToast = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3500);
          };

          const [adminAuth, setAdminAuth] = useState({ 
            id: 'admin', 
            password: '', 
            isAuthenticated: false, 
            error: '', 
            name: 'Interviewer Admin'
          });

          // Modular Data State
          const [schemas, setSchemas] = useState({});
          const [questionBank, setQuestionBank] = useState([]);
          const [exams, setExams] = useState([]);
          const [submissions, setSubmissions] = useState(() => {
            const saved = localStorage.getItem('yassir_submissions');
            return saved ? JSON.parse(saved) : [];
          });
          const [isDataLoaded, setIsDataLoaded] = useState(false);

          useEffect(() => {
            const loadModularData = async () => {
              try {
                const qRes = await fetch('data/questions.json');
                if (qRes.ok) {
                  const qData = await qRes.json();
                  setQuestionBank(qData.questions || []);
                  setSchemas(qData.schemas || {});
                }

                const eRes = await fetch('data/exams.json');
                if (eRes.ok) {
                  const eData = await eRes.json();
                  setExams(eData.exams || []);
                }
              } catch (err) {
                console.warn("Could not load modular JSON files, falling back to local state:", err);
              } finally {
                setIsDataLoaded(true);
              }
            };

            loadModularData();
          }, []);

          // Active Candidate Exam Session State
          const [activeExamId, setActiveExamId] = useState('exam-001');
          const [candidateInfo, setCandidateInfo] = useState({ name: '', email: '', examCode: 'YASSIR-2026' });
          const [candidateSlide, setCandidateSlide] = useState(0);
          const [candidateAnswers, setCandidateAnswers] = useState({});
          const [candidateTextAnswers, setCandidateTextAnswers] = useState({});
          const [startTime, setStartTime] = useState(null);
          const [elapsedSeconds, setElapsedSeconds] = useState(0);
          const [tabSwitchCount, setTabSwitchCount] = useState(0);

          // Modals & Editing Forms
          const [selectedSubmission, setSelectedSubmission] = useState(null);
          const [editingExamId, setEditingExamId] = useState(null);

          const activeExam = useMemo(() => {
            return exams.find(e => e.id === activeExamId) || exams[0];
          }, [exams, activeExamId]);

          const activeQuestions = useMemo(() => {
            if (!activeExam || !activeExam.questionIds) return [];
            return activeExam.questionIds.map(qid => questionBank.find(q => q.id === qid)).filter(Boolean);
          }, [activeExam, questionBank]);

          useEffect(() => {
            if (!isFirebaseConnected || !db) return;
            const unsubscribe = db.collection("candidate_submissions")
              .orderBy("submittedAt", "desc")
              .onSnapshot((snapshot) => {
                const cloudSubmissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (cloudSubmissions.length > 0) setSubmissions(cloudSubmissions);
              }, (err) => console.log("Firebase sync fallback:", err));

            return () => unsubscribe();
          }, []);

          useEffect(() => {
            localStorage.setItem('yassir_submissions', JSON.stringify(submissions));
          }, [submissions]);

          useEffect(() => {
            const totalQs = activeQuestions?.length || 0;
            if (route !== 'candidate_exam' || candidateSlide < 1 || candidateSlide > totalQs) return;

            const handlePreventCopy = (e) => {
              e.preventDefault();
              showToast("Copying content is disabled during the exam!", "error");
            };
            const handlePreventContextMenu = (e) => { e.preventDefault(); };

            const handleVisibilityChange = () => {
              if (document.hidden) {
                setTabSwitchCount(prev => {
                  const newCount = prev + 1;
                  showToast(`Screen/Tab switch detected! (${newCount})`, "error");
                  return newCount;
                });
              }
            };

            window.addEventListener('copy', handlePreventCopy);
            window.addEventListener('cut', handlePreventCopy);
            window.addEventListener('contextmenu', handlePreventContextMenu);
            document.addEventListener('visibilitychange', handleVisibilityChange);

            return () => {
              window.removeEventListener('copy', handlePreventCopy);
              window.removeEventListener('cut', handlePreventCopy);
              window.removeEventListener('contextmenu', handlePreventContextMenu);
              document.removeEventListener('visibilitychange', handleVisibilityChange);
            };
          }, [route, candidateSlide, activeQuestions?.length]);

          useEffect(() => {
            let timer;
            const totalQs = activeQuestions?.length || 0;
            if (startTime && route === 'candidate_exam' && candidateSlide >= 1 && candidateSlide <= totalQs) {
              timer = setInterval(() => {
                setElapsedSeconds(Math.floor((Date.now() - startTime) / 1000));
              }, 1000);
            }
            return () => clearInterval(timer);
          }, [startTime, route, candidateSlide, activeQuestions?.length]);

          const handleAdminLogin = (e) => {
            e.preventDefault();
            if (adminAuth.id.trim() === 'admin' && adminAuth.password === 'yassir2026!') {
              setAdminAuth({ ...adminAuth, isAuthenticated: true, error: '' });
              setRoute('page_results');
              showToast("Admin authenticated.");
            } else {
              setAdminAuth({ ...adminAuth, error: 'Invalid ID or Password.' });
            }
          };

          const handleStartExam = (e) => {
            e.preventDefault();
            const matchedExam = exams.find(ex => ex.accessCode.trim().toLowerCase() === candidateInfo.examCode.trim().toLowerCase());
            if (!matchedExam) {
              showToast("Invalid Access Code. Check with interviewer.", "error");
              return;
            }
            setActiveExamId(matchedExam.id);
            setStartTime(Date.now());
            setCandidateSlide(1);
            setRoute('candidate_exam');
          };

          const handleSubmitExam = async () => {
            let score = 0;
            let mcqTotal = 0;
            (activeQuestions || []).forEach(q => {
              if (q.type === 'mcq') {
                mcqTotal += 1;
                if (candidateAnswers[q.id] === q.correct) score += 1;
              }
            });

            const submissionData = {
              id: `sub-${Date.now()}`,
              candidateName: candidateInfo.name,
              candidateEmail: candidateInfo.email,
              examId: activeExamId,
              examTitle: activeExam?.title || 'Assessment',
              mcqAnswers: candidateAnswers,
              textAnswers: candidateTextAnswers,
              mcqScore: score,
              mcqTotal: mcqTotal,
              percentage: mcqTotal > 0 ? Math.round((score / mcqTotal) * 100) : 0,
              timeTakenSeconds: elapsedSeconds,
              tabSwitches: tabSwitchCount,
              submittedAt: new Date().toLocaleString()
            };

            if (isFirebaseConnected && db) {
              try { await db.collection("candidate_submissions").add(submissionData); }
              catch (err) { console.error(err); }
            }

            setSubmissions(prev => [submissionData, ...prev]);
            setCandidateSlide((activeQuestions?.length || 0) + 1);
            showToast("Exam submitted successfully!");
          };

          const exportJSONFile = (data, filename) => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Exported ${filename}`);
          };

          const exportResultsCSV = () => {
            let csv = "Candidate Name,Candidate Email,Exam Title,MCQ Score,MCQ Total,Percentage,Time Spent (s),Tab Switches,Submitted At\n";
            submissions.forEach(s => {
              csv += `"${s.candidateName}","${s.candidateEmail}","${s.examTitle}",${s.mcqScore},${s.mcqTotal},${s.percentage}%,${s.timeTakenSeconds},${s.tabSwitches},"${s.submittedAt}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `candidate_results_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          };

          const formatTime = (secs) => {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          };

          const totalQs = activeQuestions?.length || 0;

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between overflow-x-hidden">
              
              {/* TOAST BANNER */}
              {toast && (
                <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl shadow-2xl font-semibold text-xs flex items-center space-x-2 border transition-all ${
                  toast.type === 'error' ? 'bg-red-950 border-red-800 text-red-200' : 'bg-emerald-950 border-emerald-800 text-emerald-200'
                }`}>
                  <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation text-red-400' : 'fa-circle-check text-emerald-400'}`}></i>
                  <span>{toast.msg}</span>
                </div>
              )}

              {}
              <header className="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/90 backdrop-blur-md sticky top-0 z-30">
                <div className="flex items-center space-x-3">
                  <div className="bg-sky-500 text-slate-950 font-black tracking-widest text-lg px-2.5 py-0.5 rounded shadow-lg shadow-sky-500/20">
                    YASSIR
                  </div>
                  <div className="flex flex-col">
                    <span className="text-white text-sm font-bold">Data Analytics Technical Assessment</span>
                    <span className="text-[10px] text-slate-400 font-mono">
                      Modular Setup • GitHub Hosted
                    </span>
                  </div>
                </div>

                {route === 'candidate_exam' && candidateSlide >= 1 && candidateSlide <= totalQs && (
                  <div className="flex items-center space-x-3">
                    {tabSwitchCount > 0 && (
                      <div className="flex items-center space-x-1.5 bg-red-950/80 px-3 py-1.5 rounded-full border border-red-800 text-red-400 font-mono text-xs font-semibold animate-pulse">
                        <i className="fa-solid fa-triangle-exclamation"></i>
                        <span>Tab Switches: {tabSwitchCount}</span>
                      </div>
                    )}
                    <div className="flex items-center space-x-2 bg-slate-800/90 px-3 py-1.5 rounded-full border border-slate-700 text-sky-400 font-mono text-xs font-semibold">
                      <i className="fa-regular fa-clock text-sky-400"></i>
                      <span>{formatTime(elapsedSeconds)} / {activeExam?.timeLimitMinutes || 20}:00</span>
                    </div>
                  </div>
                )}

                {/* NAVIGATION BAR */}
                {adminAuth.isAuthenticated ? (
                  <div className="flex items-center space-x-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                    <button onClick={() => setRoute('candidate_entry')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route.startsWith('candidate') ? 'bg-sky-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Candidate View</button>
                    <button onClick={() => setRoute('page_questions')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route === 'page_questions' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Questions ({questionBank.length})</button>
                    <button onClick={() => setRoute('page_exams')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route === 'page_exams' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Exams ({exams.length})</button>
                    <button onClick={() => setRoute('page_results')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${route === 'page_results' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Results ({submissions.length})</button>
                    <button onClick={() => { setAdminAuth(prev => ({ ...prev, isAuthenticated: false })); setRoute('candidate_entry'); }} className="px-2.5 py-1.5 bg-red-950/80 hover:bg-red-900 border border-red-800 text-red-300 rounded-lg font-bold text-xs">Log Out</button>
                  </div>
                ) : (
                  <div className="flex items-center space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                    <button onClick={() => setRoute('candidate_entry')} className={`px-3 py-1.5 rounded-lg font-bold ${route.startsWith('candidate') ? 'bg-sky-500 text-slate-950' : 'text-slate-400'}`}>Candidate View</button>
                    <button onClick={() => setRoute('admin_login')} className={`px-3 py-1.5 rounded-lg font-bold ${route === 'admin_login' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}><i className="fa-solid fa-lock text-amber-400 mr-1"></i>Admin Portal</button>
                  </div>
                )}
              </header>

              {}
              <main className="flex-1 p-6 flex items-center justify-center relative">

                {/* VIEW 1: CANDIDATE REGISTRATION */}
                {route === 'candidate_entry' && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
                    <div className="space-y-1">
                      <div className="text-sky-400 text-xs font-mono font-bold flex items-center space-x-1.5">
                        <i className="fa-solid fa-bolt"></i>
                        <span>CANDIDATE EXAM PORTAL</span>
                      </div>
                      <h1 className="text-2xl font-bold text-white">Start Candidate Session</h1>
                      <p className="text-xs text-slate-400">Enter your credentials and the access code from your interviewer.</p>
                    </div>

                    <form onSubmit={handleStartExam} className="space-y-4 text-xs">
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1">Full Name</label>
                        <input type="text" required value={candidateInfo.name} onChange={e => setCandidateInfo({ ...candidateInfo, name: e.target.value })} placeholder="e.g. Sarah Mansouri" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500" />
                      </div>
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1">Email Address</label>
                        <input type="email" required value={candidateInfo.email} onChange={e => setCandidateInfo({ ...candidateInfo, email: e.target.value })} placeholder="sarah@example.com" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500" />
                      </div>
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1">Exam Access Code</label>
                        <input type="text" required value={candidateInfo.examCode} onChange={e => setCandidateInfo({ ...candidateInfo, examCode: e.target.value })} placeholder="e.g. YASSIR-2026" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sky-400 font-mono font-bold uppercase focus:outline-none focus:border-sky-500" />
                      </div>
                      <button type="submit" className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-lg transition-all flex items-center justify-center space-x-2 shadow-lg shadow-sky-500/20">
                        <span>Launch Assessment</span>
                        <i className="fa-solid fa-arrow-right"></i>
                      </button>
                    </form>
                  </div>
                )}

                {/* VIEW 2: CANDIDATE EXAM PLAYER */}
                {route === 'candidate_exam' && (
                  <div className="w-full max-w-6xl flex flex-col space-y-4 select-none">
                    {candidateSlide >= 1 && candidateSlide <= totalQs && (
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col justify-between min-h-[500px]">
                        {(() => {
                          const currentQ = activeQuestions[candidateSlide - 1];
                          if (!currentQ) return null;
                          const schema = schemas[currentQ.schemaId] || Object.values(schemas)[0] || { name: 'Standard Schema', tables: [] };
                          const selectedOption = candidateAnswers[currentQ.id];
                          const textAns = candidateTextAnswers[currentQ.id] || { flawsText: '', sqlText: '' };

                          return (
                            <div className="grid grid-cols-12 gap-6 flex-1">
                              {/* LEFT PANEL */}
                              <div className="col-span-5 border-r border-slate-800 pr-5 flex flex-col justify-between space-y-4">
                                <div className="space-y-3">
                                  <div className="flex justify-between items-center">
                                    <span className="text-xs font-mono font-bold text-sky-400 bg-sky-950 border border-sky-800 px-3 py-0.5 rounded-full">
                                      Question {candidateSlide} / {totalQs}
                                    </span>
                                    <span className={`text-[10px] px-2 py-0.5 rounded font-mono font-semibold ${
                                      currentQ.difficulty === 'Easy' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                      currentQ.difficulty === 'Medium' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                                      'bg-red-950 text-red-400 border border-red-800'
                                    }`}>
                                      {currentQ.difficulty}
                                    </span>
                                  </div>
                                  <h2 className="text-base font-bold text-slate-100 leading-snug">{currentQ.question}</h2>
                                </div>

                                {/* SCHEMA DRAWER */}
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2 overflow-y-auto max-h-56 text-xs font-mono">
                                  <span className="text-amber-400 font-bold block border-b border-slate-800 pb-1 flex items-center gap-1.5">
                                    <i className="fa-solid fa-database"></i>
                                    <span>Schema: {schema.name}</span>
                                  </span>
                                  {schema.tables?.map((t, idx) => (
                                    <div key={idx} className="space-y-0.5">
                                      <span className="text-sky-400 font-bold block text-[11px]">// {t.name}</span>
                                      <div className="pl-2 text-slate-300 text-[10px]">{t.cols.join(' • ')}</div>
                                    </div>
                                  ))}
                                </div>
                              </div>

                              {/* RIGHT PANEL */}
                              <div className="col-span-7 flex flex-col justify-between pl-1">
                                {currentQ.type === 'mcq' && currentQ.options && (
                                  <div className="space-y-3 my-auto">
                                    {currentQ.options.map((opt) => {
                                      const isSelected = selectedOption === opt.id;
                                      return (
                                        <div key={opt.id} onClick={() => setCandidateAnswers(prev => ({ ...prev, [currentQ.id]: opt.id }))} className={`p-3.5 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${isSelected ? 'bg-sky-500/10 border-sky-500 text-sky-200 ring-1 ring-sky-500' : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                          <span className="text-xs font-mono pr-2">{opt.text}</span>
                                          <div className={`w-5 h-5 rounded-full border flex items-center justify-center text-xs font-bold ${isSelected ? 'border-sky-400 bg-sky-500 text-slate-950' : 'border-slate-700 text-slate-500'}`}>{opt.id}</div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}

                                {currentQ.type === 'scenario' && (
                                  <div className="space-y-3 my-auto text-xs">
                                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 font-mono text-[11px] text-sky-300 max-h-36 overflow-y-auto">
                                      <pre>{currentQ.buggySql}</pre>
                                    </div>
                                    <div>
                                      <label className="block text-[11px] font-semibold text-slate-300 mb-1">1. Logical Bugs Analysis:</label>
                                      <textarea rows={2} value={textAns.flawsText} onChange={e => setCandidateTextAnswers(prev => ({ ...prev, [currentQ.id]: { ...prev[currentQ.id], flawsText: e.target.value } }))} placeholder="Explain flaws..." className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500" />
                                    </div>
                                    <div>
                                      <label className="block text-[11px] font-semibold text-slate-300 mb-1">2. Refactored SQL Query:</label>
                                      <textarea rows={3} value={textAns.sqlText} onChange={e => setCandidateTextAnswers(prev => ({ ...prev, [currentQ.id]: { ...prev[currentQ.id], sqlText: e.target.value } }))} placeholder="WITH RankedOrders AS ( ... )" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 font-mono text-sky-300 focus:outline-none focus:border-sky-500" />
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })()}
                      </div>
                    )}

                    {candidateSlide > totalQs && (
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-10 text-center max-w-lg mx-auto shadow-2xl space-y-4">
                        <div className="w-16 h-16 bg-emerald-500/10 border border-emerald-500 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                          <i className="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-white">Assessment Complete!</h2>
                        <p className="text-slate-400 text-xs">Thank you <span className="text-sky-400 font-bold">{candidateInfo.name}</span>. Your response has been recorded.</p>
                      </div>
                    )}

                    {candidateSlide >= 1 && candidateSlide <= totalQs && (
                      <div className="flex justify-between items-center bg-slate-900/90 border border-slate-800 p-3 rounded-xl">
                        <button onClick={() => setCandidateSlide(prev => Math.max(1, prev - 1))} disabled={candidateSlide === 1} className="px-4 py-2 bg-slate-800 disabled:opacity-30 text-xs font-bold rounded-lg text-slate-300">Previous</button>
                        {candidateSlide < totalQs ? (
                          <button onClick={() => setCandidateSlide(prev => prev + 1)} className="px-5 py-2 bg-sky-500 hover:bg-sky-400 text-slate-950 text-xs font-bold rounded-lg">Next Question</button>
                        ) : (
                          <button onClick={handleSubmitExam} className="px-6 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-lg">Submit Exam</button>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {/* VIEW 3: ADMIN LOGIN */}
                {route === 'admin_login' && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-5">
                    <h2 className="text-xl font-bold text-white border-b border-slate-800 pb-3">Admin Login</h2>
                    {adminAuth.error && <div className="text-xs text-red-400">{adminAuth.error}</div>}
                    <form onSubmit={handleAdminLogin} className="space-y-4 text-xs">
                      <input type="text" value={adminAuth.id} onChange={e => setAdminAuth({ ...adminAuth, id: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white" />
                      <input type="password" value={adminAuth.password} onChange={e => setAdminAuth({ ...adminAuth, password: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white" />
                      <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded">Unlock Workspace</button>
                    </form>
                  </div>
                )}

                {/* PAGE: QUESTIONS REPOSITORY */}
                {route === 'page_questions' && (
                  <div className="w-full max-w-7xl h-full flex flex-col space-y-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 flex justify-between items-center">
                      <div>
                        <h2 className="text-base font-bold text-white">Modular Question Bank</h2>
                        <p className="text-xs text-slate-400">Questions loaded from <code className="text-sky-400">data/questions.json</code></p>
                      </div>
                      <button onClick={() => exportJSONFile({ schemas, questions: questionBank }, 'questions.json')} className="px-4 py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg flex items-center space-x-1.5">
                        <i className="fa-solid fa-download"></i>
                        <span>Export questions.json</span>
                      </button>
                    </div>

                    <div className="grid grid-cols-1 gap-3 overflow-y-auto max-h-[70vh]">
                      {questionBank.map((q, idx) => (
                        <div key={q.id} className="p-4 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                          <span className="font-bold text-white text-sm">#{idx + 1}. {q.title}</span>
                          <p className="text-slate-300 mt-1">{q.question}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* PAGE: RESULTS MATRIX */}
                {route === 'page_results' && (
                  <div className="w-full max-w-7xl h-full flex flex-col space-y-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 flex justify-between items-center">
                      <h2 className="text-base font-bold text-white">Candidate Assessment Results</h2>
                      <div className="flex space-x-2">
                        <button onClick={exportResultsCSV} className="px-3 py-1.5 bg-emerald-500 text-slate-950 font-bold text-xs rounded-lg">Export CSV</button>
                        <button onClick={() => exportJSONFile(submissions, 'submissions.json')} className="px-3 py-1.5 bg-sky-500 text-slate-950 font-bold text-xs rounded-lg">Export JSON</button>
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                          <tr>
                            <th className="p-3">Candidate</th>
                            <th className="p-3">Exam Paper</th>
                            <th className="p-3">MCQ Score</th>
                            <th className="p-3">Time</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {submissions.map(sub => (
                            <tr key={sub.id}>
                              <td className="p-3 font-medium text-white">{sub.candidateName} <br/><span className="text-[10px] text-slate-500">{sub.candidateEmail}</span></td>
                              <td className="p-3 text-slate-400">{sub.examTitle}</td>
                              <td className="p-3 font-mono text-emerald-400 font-bold">{sub.mcqScore} / {sub.mcqTotal} ({sub.percentage}%)</td>
                              <td className="p-3 text-slate-500 text-[11px]">{formatTime(sub.timeTakenSeconds || 0)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

              </main>

              <footer className="h-10 border-t border-slate-900 bg-slate-950 px-6 flex items-center justify-between text-[11px] text-slate-500">
                <div>Yassir Technical Examination System</div>
                <div className="font-mono">Active Page: <strong className="text-slate-300 uppercase">{route}</strong></div>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
